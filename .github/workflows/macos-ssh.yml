name: macOS SSH debug session

# Push to a branch named `ssh-macos` (or `ssh-macos-*`) to get an SSH session
# on a GitHub-hosted macOS runner. The SSH command is printed in the job log
# (step "Open upterm session"). Only the GitHub user who triggered the run can
# connect, using one of the SSH keys registered on their GitHub account.
# Run `touch continue` in the session (or cancel the run) to end the job early.

on:
  push:
    branches: [ 'ssh-macos', 'ssh-macos-*' ]
  workflow_dispatch:

jobs:
  ssh:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v5
    - uses: nixbuild/nix-quick-install-action@v34

    - run: brew update && brew install opam autoconf zeromq zlib automake

    - name: Open upterm session
      uses: owenthereal/action-upterm@v1
      with:
        limit-access-to-actor: true
